name: 🚀 Deploy Backend a Render.com

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'Dockerfile'
      - 'render.yaml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: # Permite ejecutar manualmente desde GitHub

jobs:
  deploy:
    name: Deploy a Render.com
    runs-on: ubuntu-latest

    steps:
      # 1. Obtener el código fuente
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v4

      # 2. Disparar el deploy en Render vía Deploy Hook
      # RENDER_DEPLOY_HOOK_URL se configura como Secret en GitHub:
      #   GitHub → Settings → Secrets and variables → Actions → New repository secret
      #   Nombre: RENDER_DEPLOY_HOOK_URL
      #   Valor: la URL del Deploy Hook que obtienes en:
      #     Render Dashboard → tu servicio → Settings → Deploy Hook → Copy
      - name: 🚀 Disparar deploy en Render.com
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "⚠️ Advertencia: RENDER_DEPLOY_HOOK_URL no está configurado en GitHub Secrets."
            echo "Si Auto-Deploy está activo en Render, el build se disparará automáticamente por el push a main."
          else
            echo "Disparando deploy hook de Render..."
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
            echo "Respuesta de Render: $RESPONSE"
          fi
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

      # 3. Esperar y verificar que el deploy fue aceptado
      - name: ✅ Deploy disparado exitosamente
        run: echo "Verifica el estado del build en https://dashboard.render.com"
