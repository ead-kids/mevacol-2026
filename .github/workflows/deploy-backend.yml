name: 🚀 Deploy Backend a Fly.io

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'Dockerfile'
      - 'fly.toml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: # Permite ejecutar manualmente desde GitHub

jobs:
  deploy:
    name: Deploy a Fly.io
    runs-on: ubuntu-latest

    steps:
      # 1. Obtener el código fuente
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v4

      # 2. Instalar Fly CLI
      - name: ⚙️ Instalar flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      # 3. Desplegar a Fly.io
      # FLY_API_TOKEN se configura como Secret en GitHub:
      # GitHub → Settings → Secrets and variables → Actions → New repository secret
      # Nombre: FLY_API_TOKEN
      # Valor: el token que obtienes con: fly tokens create deploy
      - name: 🚀 Deploy a Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
