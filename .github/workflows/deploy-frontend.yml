name: 🚀 Deploy Frontend a GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch: # Permite ejecutar manualmente desde GitHub

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    name: Build y Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Obtener el código fuente
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: ⚙️ Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # 3. Instalar dependencias del frontend
      - name: 📦 Instalar dependencias
        run: npm install
        working-directory: frontend

      # 4. Compilar el frontend con Vite
      # VITE_API_URL debe configurarse como Secret en GitHub → Settings → Secrets and variables → Actions
      # Formato: https://mevacol-api.onrender.com/api  (la URL exacta de tu servicio en Render)
      - name: 🔨 Build de producción
        run: npm run build
        working-directory: frontend
        env:
          NODE_ENV: production
          # Base URL para GitHub Pages — el repositorio se llama mevacol-2026
          VITE_BASE_URL: /mevacol-2026/
          # URL de la API del backend en Render.com (configurar como Secret)
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      # 5. Agregar archivo .nojekyll para que GitHub Pages sirva correctamente los assets de Vite
      - name: 📄 Crear .nojekyll
        run: touch frontend/dist/.nojekyll

      # 6. Desplegar a la rama gh-pages
      - name: 🚀 Deploy a GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: frontend/dist
          branch: gh-pages
          clean: true
          commit-message: "deploy: frontend build desde commit ${{ github.sha }}"
