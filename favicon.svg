<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Base Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" stroke="#334155" stroke-width="4" fill="none"/>
  
  <!-- Emblem Hexagon / Shield -->
  <g filter="url(#shadow)">
    <!-- Letra M estilizada de MEVACOL -->
    <path d="M128 368 V160 L216 272 L256 224 L296 272 L384 160 V368" stroke="url(#primaryGrad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Punto/Insignia de Inventario & Dinamismo -->
    <circle cx="256" cy="144" r="28" fill="url(#accentGrad)"/>
  </g>
  <text x="256" y="440" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="46" fill="#f8fafc" letter-spacing="6" text-anchor="middle">MEVACOL</text>
</svg>